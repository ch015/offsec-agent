# CH015 VA Phase Handoff Template
#
# VA -> Verify/Pentest 단계 전환 시 다음 에이전트에 필요한 최소 데이터만 담은 경량 파일.
# 전문 보고서 Read 없이 이 파일만으로 다음 단계의 초기 컨텍스트를 구성할 수 있다.
#
# 생성 시점: VA Phase 5.1 Index 생성과 동시
# 생성 주체: VA Auditor
# 소비자: OffSec Lead (피드백 루프 구성), Verifier (R0.5 후 참조), Pentester (대상 추출)
#
# Findings Index와의 차이:
#   - Index: Finding 메타데이터 + 라인 오프셋 (선택 Read 지원)
#   - Handoff: 다음 단계에 필요한 구조화 데이터 (Finding 간 관계, 체인, 점수)

engagement_id: "{{engagement_id}}"
phase: "va"
round: "{{round}}"
source_report: "{{report_filename}}"
findings_index: "{{index_filename}}"
raw_findings_ledger: "{{raw_ledger_filename}}"
pentest_plan: "{{pentest_plan_filename}}"
generated_at: "{{timestamp}}"

score:
  security_score: "{{score}}/100 ({{grade}})"
  composite_pass: "{{pass_result}}"
  business_impact_score: "{{bis}}"

severity_distribution:
  CRITICAL: "{{critical_count}}"
  HIGH: "{{high_count}}"
  MEDIUM: "{{medium_count}}"
  LOW: "{{low_count}}"
  STRUCTURAL_WEAKNESS: "{{sw_count}}"

dimensions_health:
  A1: "{{a1_status}}"
  A2: "{{a2_status}}"
  A3: "{{a3_status}}"
  A4: "{{a4_status}}"
  A5: "{{a5_status}}"
  A6: "{{a6_status}}"
  A7: "{{a7_status}}"
  A8: "{{a8_status}}"

attack_chains:{{^attack_chains}} []{{/attack_chains}}
{{#attack_chains}}
  - chain_id: "{{chain_id}}"
    steps:{{^steps}} []{{/steps}}
{{#steps}}
      - "{{.}}"
{{/steps}}
    combined_impact: "{{combined_impact}}"
{{/attack_chains}}

prerequisite_groups:{{^prerequisite_groups}} []{{/prerequisite_groups}}
{{#prerequisite_groups}}
  - group: "{{group}}"
    findings:{{^findings}} []{{/findings}}
{{#findings}}
      - "{{.}}"
{{/findings}}
    defense_survives: "{{defense_survives}}"
{{/prerequisite_groups}}

unverified_ratio: "{{pct}}%"

pending_verification:
  PENTEST: "{{pentest_count}}건"
  REDTEAM: "{{redteam_count}}건"
  EXTERNAL: "{{external_count}}건"

classification_gate:
  raw_candidates_total: "{{candidate_total}}"
  classified_candidates: "{{classified_candidate_count}}"
  unclassified_candidates: "{{unclassified_candidate_count}}"
  publish_allowed: "{{publish_allowed}}"
