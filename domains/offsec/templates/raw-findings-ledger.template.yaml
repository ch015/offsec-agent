# CH015 Raw Findings Ledger Template
#
# Purpose:
#   Preserve every security candidate produced by VA, Verifier, Pentest, Sweep,
#   feedback, or manual convergence before final report filtering. Final reports
#   are derived from this ledger; candidates must not disappear without an
#   explicit final_status.
#
# Generated by:
#   VA Auditor during Phase 4.7, then updated by Verifier, Pentester, and
#   OffSec Lead convergence.
#
# Required invariant:
#   publish_allowed is false if any candidate has final_status: UNCLASSIFIED.

engagement_id: "{{engagement_id}}"
target: "{{target}}"
round: "{{round}}"
generated_at: "{{timestamp}}"
updated_at: "{{timestamp}}"

summary:
  total_candidates: "{{candidate_total}}"
  confirmed: "{{confirmed_count}}"
  downgraded: "{{downgraded_count}}"
  folded_into: "{{folded_count}}"
  backlog: "{{backlog_count}}"
  excluded: "{{excluded_count}}"
  pending_pentest: "{{pending_pentest_count}}"
  pending_external: "{{pending_external_count}}"
  false_positive: "{{false_positive_count}}"
  out_of_scope: "{{out_of_scope_count}}"
  disputed: "{{disputed_count}}"
  unclassified: "{{unclassified_count}}"
  publish_allowed: "{{publish_allowed}}"

status_values:
  - CANDIDATE
  - CONFIRMED
  - DOWNGRADED
  - FOLDED_INTO
  - BACKLOG
  - EXCLUDED
  - PENDING_PENTEST
  - PENDING_EXTERNAL
  - FALSE_POSITIVE
  - OUT_OF_SCOPE
  - DISPUTED
  - UNCLASSIFIED

candidates:{{^candidates}} []{{/candidates}}
{{#candidates}}
  - candidate_id: "{{candidate_id}}"
    proposed_finding_id: "{{proposed_finding_id}}"
    final_finding_id: "{{final_finding_id}}"
    title: "{{title}}"
    source_phase: "{{source_phase}}"
    source_agent: "{{source_agent}}"
    dimension: "{{dimension}}"
    root_cause_location: "{{root_cause_location}}"  # file:line of the root cause (for folding dedup)
    remediation_key: "{{remediation_key}}"           # short slug of the fix (same key = same fix = fold candidate)
    affected_instances:{{^affected_instances}} []{{/affected_instances}}
{{#affected_instances}}
      - type: "{{type}}"                             # route | function | file | asset | flow | config
        target: "{{target}}"
        evidence: "{{evidence}}"
        exploitability: "{{exploitability}}"         # confirmed | likely | unverified | blocked | not_applicable
{{/affected_instances}}
    severity_initial: "{{severity_initial}}"
    severity_current: "{{severity_current}}"
    final_status: "{{final_status}}"
    score_included: {{score_included}}
    evidence:
      class: "{{evidence_class}}"
      locations:{{^locations}} []{{/locations}}
{{#locations}}
        - "{{.}}"
{{/locations}}
      live_evidence:{{^live_evidence}} []{{/live_evidence}}
{{#live_evidence}}
        - "{{.}}"
{{/live_evidence}}
    validity:
      code_exists: "{{code_exists}}"
      reachable: "{{reachable}}"              # confirmed | likely | unverified | not_reachable
      business_relevance: "{{business_relevance}}" # high | medium | low | unknown
      exploit_path: "{{exploit_path}}"        # confirmed | partial | unverified | not_applicable
    prerequisites:
      auth: "{{auth_prerequisite}}"           # unauth | guest | role_specific | admin | unknown
      data: "{{data_prerequisite}}"           # none | test_data | required_external
      environment: "{{environment_prerequisite}}" # local | staging | prod | external_system
    routing:
      verify_required: {{verify_required}}
      verify_reason: "{{verify_reason}}"
      pentest_route: "{{pentest_route}}"
      pentest_plan_id: "{{pentest_plan_id}}"     # PENDING_PENTEST일 때 필수 — pentest plan의 scenario_id 연결
      required_access: "{{required_access}}"     # PENDING_EXTERNAL일 때 필수 — 확정에 필요한 접근(예: 운영 콘솔, 외부 콜백 수신자)
      external_system: "{{external_system}}"     # PENDING_EXTERNAL일 때 필수 — repo 밖 대상 시스템 식별
    final_mapping:
      folded_into: "{{folded_into}}"
      exclusion_reason: "{{exclusion_reason}}"
      downgrade_reason: "{{downgrade_reason}}"   # DOWNGRADED일 때 필수 — 심각도 하향 근거
      dispute_reason: "{{dispute_reason}}"       # DISPUTED일 때 필수 — 양측(VA/Verifier) 주장 요약
      ciso_decision:                             # DISPUTED 해소 시 CISO가 write-back (07_ciso_decision.yaml과 동기화)
        method: "{{ciso_decision_method}}"       # pentest_route_f | reanalysis | conservative_default | time_bounded_accept
        final_severity: "{{ciso_decision_final_severity}}"
        rationale: "{{ciso_decision_rationale}}"
      next_step: "{{next_step}}"
{{/candidates}}
