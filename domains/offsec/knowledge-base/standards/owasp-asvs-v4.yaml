# OWASP Application Security Verification Standard (ASVS) v4.0.3
# 웹 애플리케이션 보안 검증 표준 — 286개 요건 중 핵심 항목 발췌
# V11(Business Logic)은 코드 분석 영역으로 ch015:va에서 커버하므로 본 파일에서 제외
# 출처: https://owasp.org/www-project-application-security-verification-standard/

standard:
  id: "owasp-asvs-v4"
  name: "OWASP ASVS 4.0.3"
  version: "4.0.3"
  url: "https://github.com/OWASP/ASVS/tree/v4.0.3"
  applies_to: [all]

requirements:

  # ─── V1: Architecture, Design and Threat Modeling ───

  - id: "ASVS V1.1.6 (L2)"
    title: "중앙 집중식 보안 제어 (Centralized Security Controls)"
    components: [APIServer, Auth, Infra]
    implementation:
      - "인증, 접근 제어, 입력 검증 등 보안 제어를 중앙화된 모듈로 구현"
      - "각 서비스가 독자적 보안 로직을 구현하지 않고 공통 라이브러리/게이트웨이 사용"
      - "보안 제어 우회 경로(bypass) 존재 여부를 아키텍처 리뷰에서 검증"
      - "마이크로서비스 환경에서 API Gateway에 공통 인증/인가 레이어 적용"
    test_criteria:
      happy: "모든 서비스가 공통 인증 미들웨어를 거쳐 요청 처리"
      failure: "공통 보안 레이어를 우회하는 직접 접근 경로 → 차단"
      boundary: "내부 서비스 간 통신에서도 mTLS + 서비스 인증 적용"

  - id: "ASVS V1.2.1 (L2)"
    title: "모든 접근 경로에 접근 제어 적용 (Access Control at Every Layer)"
    components: [APIServer, Auth, Admin, DataLayer]
    implementation:
      - "Presentation, Business, Data 각 계층에서 접근 제어 검증"
      - "URL 직접 접근(forced browsing)으로 인가 우회 불가 확인"
      - "API 엔드포인트별 최소 권한 원칙 적용"
      - "서버사이드에서 최종 접근 제어 결정 — 클라이언트 측 제어에 의존 금지"
    test_criteria:
      happy: "인가된 사용자가 허용된 엔드포인트에 정상 접근"
      failure: "미인가 사용자의 직접 URL 접근 → 403"
      boundary: "권한 변경 직후 세션 갱신 없이 기존 권한으로 접근 시도 → 거부"

  - id: "ASVS V1.6.2 (L2)"
    title: "신뢰할 수 있는 서비스 계층에서 보안 결정 (Trusted Service Layer)"
    components: [APIServer, SDKClient, Infra]
    implementation:
      - "보안 관련 의사결정(인증, 인가, 입력 검증)은 반드시 서버사이드에서 수행"
      - "클라이언트/SDK에서의 검증은 UX 용도로만 사용, 보안 목적으로 신뢰 금지"
      - "서버리스/엣지 함수 환경에서도 동일한 보안 제어 적용"
    test_criteria:
      happy: "서버사이드 검증 통과 후 정상 응답"
      failure: "클라이언트 검증만 우회하고 서버 직접 호출 → 서버에서 거부"
      boundary: "CDN/엣지에서 캐시된 응답의 인가 상태 불일치 → 원본 재검증"

  # ─── V2: Authentication ───

  - id: "ASVS V2.1.1 (L1)"
    title: "비밀번호 정책 (Password Policy)"
    components: [Auth, Admin]
    implementation:
      - "최소 길이 12자 이상, 최대 128자 이상 허용"
      - "문자 종류 복잡도 요구 대신 길이 + breached-password 사전 차단"
      - "비밀번호 입력 시 붙여넣기(paste) 허용 — 패스워드 매니저 호환"
      - "Unicode 비밀번호 허용, NFKC 정규화 적용"
      - "변경 시 현재 비밀번호 확인 필수"
    test_criteria:
      happy: "12자 이상 비밀번호 설정 성공"
      failure: "breached-password 사전에 포함된 비밀번호 → 거부 + 안내 메시지"
      boundary: "128자 비밀번호 설정 및 인증 정상 동작"

  - id: "ASVS V2.2.1 (L1)"
    title: "무차별 대입 방지 (Anti-Brute Force)"
    components: [Auth, APIServer, FDSEngine]
    implementation:
      - "로그인 실패 5~10회 후 계정 잠금 또는 progressive delay 적용"
      - "CAPTCHA 또는 proof-of-work 메커니즘 연계"
      - "IP 기반 rate limiting + 계정 기반 lockout 병행"
      - "잠금 해제: 시간 기반 자동 해제(15~30분) 또는 관리자 수동 해제"
      - "인증 응답에서 유효/무효 계정 구분 불가하도록 일관된 메시지 반환"
    test_criteria:
      happy: "유효한 자격증명으로 인증 성공"
      failure: "10회 연속 실패 → 계정 잠금 + 429/423 응답"
      boundary: "잠금 시간 경과 후 정상 인증 가능"

  - id: "ASVS V2.5.2 (L1)"
    title: "비밀번호 재설정 보안 (Password Reset Security)"
    components: [Auth, APIServer]
    implementation:
      - "재설정 토큰: 최소 128비트 엔트로피, 단일 사용(one-time)"
      - "토큰 유효 시간: 최대 15~30분"
      - "비밀번호 힌트 또는 지식 기반 인증 금지"
      - "재설정 완료 시 기존 모든 세션 무효화"
      - "재설정 요청 시 이메일 존재 여부 미노출(일관된 응답)"
    test_criteria:
      happy: "유효 토큰으로 비밀번호 재설정 성공 + 기존 세션 무효화"
      failure: "만료된 토큰으로 재설정 시도 → 거부"
      boundary: "동일 토큰 2회 사용 시도 → 2회차 거부"

  - id: "ASVS V2.8.1 (L2)"
    title: "다중 인증 (Multi-Factor Authentication)"
    components: [Auth, Admin, SDKClient]
    implementation:
      - "관리자/특권 계정: MFA 필수 (TOTP RFC 6238, WebAuthn/FIDO2)"
      - "SMS OTP 단독 사용 지양 — SIM swap 공격 위험"
      - "MFA 복구 코드: 일회성, 암호화 저장, 생성 시 1회만 표시"
      - "MFA 등록/해제 시 추가 인증 또는 대면 확인"
    test_criteria:
      happy: "TOTP 코드 입력 후 2차 인증 성공"
      failure: "잘못된 OTP 코드 → 거부, 3회 실패 → 일시 잠금"
      boundary: "TOTP 시간 윈도우(±30초) 경계에서 인증 성공"

  # ─── V3: Session Management ───

  - id: "ASVS V3.2.1 (L1)"
    title: "세션 토큰 보안 (Session Token Security)"
    components: [Auth, APIServer]
    implementation:
      - "세션 ID: 최소 128비트 엔트로피, CSPRNG 생성"
      - "쿠키 속성: httpOnly, secure, SameSite=Lax 이상"
      - "세션 토큰을 URL 파라미터에 포함 금지"
      - "인증 성공 후 세션 ID 재발급(session fixation 방지)"
    test_criteria:
      happy: "로그인 성공 시 새 세션 ID 발급 + secure 쿠키 설정"
      failure: "HTTP(평문) 통신에서 세션 쿠키 미전송"
      boundary: "로그인 전후 세션 ID 비교 → 반드시 상이"

  - id: "ASVS V3.3.1 (L1)"
    title: "세션 만료 및 로그아웃 (Session Timeout and Logout)"
    components: [Auth, APIServer, SDKClient]
    implementation:
      - "유휴 타임아웃: 15~30분 (위험도에 따라 조정)"
      - "절대 타임아웃: 최대 12~24시간"
      - "로그아웃 시 서버사이드 세션 즉시 무효화"
      - "JWT 사용 시 서버사이드 blocklist 또는 단기 만료(15분) + refresh 토큰 조합"
      - "민감 작업(결제, 비밀번호 변경) 시 재인증(step-up authentication)"
    test_criteria:
      happy: "로그아웃 후 세션 토큰으로 재접근 → 401"
      failure: "유휴 타임아웃 초과 후 요청 → 세션 만료"
      boundary: "절대 타임아웃 직전 활동 시에도 만료 적용"

  - id: "ASVS V3.4.1 (L1)"
    title: "쿠키 기반 세션 보안 속성 (Cookie Security Attributes)"
    components: [APIServer, Auth]
    implementation:
      - "Secure 플래그: HTTPS 전용 전송"
      - "HttpOnly 플래그: JavaScript 접근 차단"
      - "SameSite=Strict 또는 Lax: CSRF 방어"
      - "Domain/Path 속성 최소화: 필요한 범위로만 한정"
      - "__Host- 또는 __Secure- 접두어 사용 권장"
    test_criteria:
      happy: "Set-Cookie 헤더에 Secure; HttpOnly; SameSite=Lax 포함"
      failure: "HTTP 응답의 쿠키에서 Secure 플래그 미설정 → 경고"
      boundary: "서브도메인에서 상위 도메인 쿠키 접근 → Domain 속성에 따라 제어"

  # ─── V4: Access Control ───

  - id: "ASVS V4.1.1 (L1)"
    title: "최소 권한 원칙 기반 접근 제어 (Principle of Least Privilege)"
    components: [APIServer, Auth, Admin, DataLayer]
    implementation:
      - "기본 거부(deny by default) 정책 — 명시적으로 허용된 것만 접근 가능"
      - "RBAC 또는 ABAC 모델 적용, 역할별 최소 필요 권한만 부여"
      - "API 엔드포인트 단위로 접근 제어 매트릭스 관리"
      - "권한 상승(privilege escalation) 경로 분석 및 차단"
      - "관리자 권한: 별도 인터페이스, MFA 필수, 감사 로그 기록"
    test_criteria:
      happy: "일반 사용자가 자신의 리소스에 CRUD 수행 성공"
      failure: "일반 사용자가 관리자 API 호출 → 403"
      boundary: "역할 변경 직후 이전 권한으로 접근 시도 → 즉시 거부"

  - id: "ASVS V4.2.1 (L1)"
    title: "데이터 수준 접근 제어 (Data-Level Access Control)"
    components: [DataLayer, APIServer, Admin]
    implementation:
      - "IDOR 방지: 모든 데이터 접근 시 requester.id == resource.owner_id 검증"
      - "간접 참조(indirect reference) 사용 또는 서버사이드 권한 확인 필수"
      - "대량 조회 API에서 소유자/권한 필터 적용"
      - "멀티테넌시: tenant_id 기반 격리, cross-tenant 접근 원천 차단"
    test_criteria:
      happy: "자신의 데이터 조회/수정 성공"
      failure: "타인의 리소스 ID로 직접 접근 → 403 또는 404"
      boundary: "삭제된 사용자의 리소스 접근 → 적절한 거부"

  - id: "ASVS V4.3.1 (L1)"
    title: "관리 인터페이스 접근 제어 (Administrative Interface Access)"
    components: [Admin, Auth, Infra]
    implementation:
      - "관리자 인터페이스: 별도 URL/포트, IP 허용 목록(allowlist) 적용"
      - "관리자 인증: MFA 필수, 세션 타임아웃 단축(15분 유휴)"
      - "관리자 작업: 전수 감사 로그 기록 (who, what, when, from where)"
      - "슈퍼관리자 계정 수 최소화, 공유 계정 금지"
    test_criteria:
      happy: "MFA 인증 완료 관리자 → 관리 기능 접근 성공"
      failure: "관리자 URL에 일반 사용자 접근 → 403 + 보안 로그"
      boundary: "허용 IP 외부에서 관리자 인증 시도 → 네트워크 레벨 차단"

  # ─── V5: Validation, Sanitization and Encoding ───

  - id: "ASVS V5.1.1 (L1)"
    title: "서버사이드 입력 검증 (Server-Side Input Validation)"
    components: [APIServer, DataLayer]
    implementation:
      - "모든 입력을 서버사이드에서 검증 — 클라이언트 검증은 보안 목적 불인정"
      - "허용 목록(positive validation) 기반 검증: 타입, 길이, 범위, 패턴"
      - "구조화된 데이터(JSON/XML): 스키마 검증 적용"
      - "배열/중첩 객체 깊이 제한, 대량 할당(mass assignment) 방지"
    test_criteria:
      happy: "유효한 형식의 입력 → 정상 처리"
      failure: "스키마 불일치 입력 → 400 Bad Request + 구체적 오류 메시지"
      boundary: "최대 길이 경계값 입력 → 정상 처리, +1 → 거부"

  - id: "ASVS V5.2.1 (L1)"
    title: "출력 인코딩 (Output Encoding)"
    components: [APIServer, SDKClient]
    implementation:
      - "HTML 컨텍스트: HTML entity encoding (&lt; &gt; &amp; &quot;)"
      - "JavaScript 컨텍스트: JavaScript Unicode escaping"
      - "URL 컨텍스트: percent encoding"
      - "CSS/SQL/LDAP 등 각 컨텍스트에 맞는 인코딩 적용"
      - "자동 인코딩 지원 템플릿 엔진 사용 (React JSX, Go html/template 등)"
    test_criteria:
      happy: "사용자 입력 포함 응답에서 인코딩 적용 확인"
      failure: "XSS 페이로드(<script>alert(1)</script>) → 인코딩되어 실행 불가"
      boundary: "이중 인코딩(double encoding) 시도 → 정상 처리"

  - id: "ASVS V5.3.4 (L1)"
    title: "SQL 인젝션 방지 (SQL Injection Prevention)"
    components: [DataLayer, APIServer]
    implementation:
      - "파라미터화 쿼리(Prepared Statement) 또는 ORM 전용 사용"
      - "동적 쿼리 빌드 시 문자열 연결 금지"
      - "저장 프로시저에서도 파라미터화 적용"
      - "DB 계정: 최소 권한 부여, DDL 권한 미부여"
    test_criteria:
      happy: "정상 쿼리 파라미터로 데이터 조회 성공"
      failure: "SQL 인젝션 페이로드(1' OR '1'='1) → 이스케이프/바인딩으로 무력화"
      boundary: "LIKE 절에서 와일드카드(%, _) 포함 입력 → 이스케이프 처리"

  # ─── V6: Stored Cryptography ───

  - id: "ASVS V6.2.1 (L1)"
    title: "승인된 암호화 알고리즘 사용 (Approved Cryptographic Algorithms)"
    components: [DataLayer, APIServer, PaymentService]
    implementation:
      - "대칭 암호: AES-128/256 (GCM 모드), ChaCha20-Poly1305"
      - "비대칭 암호: RSA-2048+ (OAEP), ECDSA P-256/P-384, Ed25519"
      - "해시: SHA-256 이상, HMAC-SHA256"
      - "금지 알고리즘: MD5, SHA-1, DES, 3DES, RC4, ECB 모드, PKCS#1 v1.5 서명"
      - "비밀번호 해싱: Argon2id, bcrypt(cost ≥ 12), scrypt"
    test_criteria:
      happy: "AES-256-GCM 암호화/복호화 정상 동작"
      failure: "폐기 알고리즘(DES, MD5) 사용 시도 → 오류/거부"
      boundary: "알고리즘 마이그레이션 중 구/신 데이터 모두 복호화 가능"

  - id: "ASVS V6.3.1 (L2)"
    title: "안전한 난수 생성 (Secure Random Number Generation)"
    components: [Auth, APIServer, PaymentService]
    implementation:
      - "CSPRNG 필수: /dev/urandom, crypto.getRandomValues(), SecureRandom"
      - "토큰, 세션 ID, API 키, 암호화 IV/nonce에 Math.random()/rand() 금지"
      - "시드 엔트로피: 최소 128비트"
      - "생성된 토큰의 예측 가능성 테스트 수행"
    test_criteria:
      happy: "생성된 토큰이 CSPRNG 기반, 128비트 이상 엔트로피"
      failure: "Math.random() 기반 토큰 → 코드 리뷰에서 탐지/거부"
      boundary: "시스템 엔트로피 풀 고갈 시에도 안전한 블로킹 동작"

  - id: "ASVS V6.4.1 (L2)"
    title: "키 관리 (Key Management)"
    components: [Infra, DataLayer, PaymentService]
    implementation:
      - "키 저장: 소스코드/설정 파일에 하드코딩 금지 — KMS 또는 HSM 사용"
      - "키 로테이션: 정기적(최소 1년) + 침해 의심 시 즉시 로테이션"
      - "키 분리: 환경(dev/staging/prod)별 상이한 키 사용"
      - "키 파기: 암호학적 소거(Cryptographic Erasure) 적용"
      - "키 접근 로그: 키 사용 이력 감사 로그 기록"
    test_criteria:
      happy: "KMS에서 키를 조회하여 암호화/복호화 정상 동작"
      failure: "소스코드에 하드코딩된 키 → CI/CD 스캔에서 탐지"
      boundary: "키 로테이션 후 이전 키로 암호화된 데이터 복호화 가능(graceful migration)"

  # ─── V7: Error Handling and Logging ───

  - id: "ASVS V7.1.1 (L1)"
    title: "일반적 에러 메시지 (Generic Error Messages)"
    components: [APIServer, SDKClient]
    implementation:
      - "에러 응답에 스택 트레이스, 내부 경로, DB 스키마 미포함"
      - "프로덕션 환경: 일반적 에러 메시지 + 고유 에러 참조 ID 반환"
      - "인증 실패: '아이디 또는 비밀번호가 잘못되었습니다' 일관 메시지"
      - "예외 처리: 모든 코드 경로에서 catch + 안전한 실패(fail secure)"
    test_criteria:
      happy: "에러 발생 시 사용자 친화적 메시지 + 에러 ID 반환"
      failure: "500 에러 시 스택 트레이스 미노출"
      boundary: "의도적으로 유발한 예외에서도 내부 정보 미노출"

  - id: "ASVS V7.2.1 (L2)"
    title: "보안 감사 로깅 (Security Audit Logging)"
    components: [APIServer, Auth, Infra, Admin]
    implementation:
      - "필수 로그 이벤트: 인증 성공/실패, 접근 제어 위반, 입력 검증 실패, 관리자 작업"
      - "로그 포맷: 구조화된 JSON (timestamp, level, actor, action, resource, result, source_ip)"
      - "민감 데이터 마스킹: 비밀번호, 토큰, 카드번호 로그 기록 금지"
      - "로그 무결성: 변조 방지(append-only), 중앙 집중 수집"
      - "보존 기간: 최소 90일 실시간 조회, 1년 아카이브"
    test_criteria:
      happy: "인증 실패 시 감사 로그에 actor/IP/timestamp 기록"
      failure: "로그에서 비밀번호 평문 검색 → 0건"
      boundary: "대량 로그 유입 시 서비스 가용성 영향 없음"

  # ─── V8: Data Protection ───

  - id: "ASVS V8.1.1 (L2)"
    title: "민감 데이터 식별 및 분류 (Data Classification)"
    components: [DataLayer, APIServer, Admin]
    implementation:
      - "데이터 분류 체계 수립: Public, Internal, Confidential, Restricted"
      - "PII/민감 데이터 인벤토리 작성 및 유지"
      - "분류 등급별 저장/전송/처리 보안 요건 정의"
      - "데이터 보존 기간 정의 및 자동 삭제 메커니즘 구현"
    test_criteria:
      happy: "Restricted 데이터가 암호화 저장 + 접근 로그 기록"
      failure: "민감 데이터가 비암호화 상태로 저장 → 스캔에서 탐지"
      boundary: "보존 기간 만료 데이터 → 자동 삭제/익명화 확인"

  - id: "ASVS V8.3.1 (L1)"
    title: "HTTP 응답 민감 데이터 보호 (Sensitive Data in HTTP Responses)"
    components: [APIServer, SDKClient]
    implementation:
      - "민감 데이터 포함 응답: Cache-Control: no-store 헤더 필수"
      - "API 응답에서 불필요한 필드 미포함 (최소 노출 원칙)"
      - "자동완성: 민감 입력 필드에 autocomplete='off' 적용"
      - "Referrer-Policy: strict-origin-when-cross-origin 이상"
    test_criteria:
      happy: "민감 정보 응답에 Cache-Control: no-store 포함"
      failure: "API 응답에 비밀번호 해시, 내부 ID 미포함"
      boundary: "CDN 캐시에 민감 데이터 응답이 캐시되지 않음"

  - id: "ASVS V8.3.4 (L1)"
    title: "개인정보 처리 제한 (Privacy Data Handling)"
    components: [DataLayer, APIServer, Admin]
    implementation:
      - "개인정보 수집: 명시적 목적 한정, 최소 수집 원칙"
      - "데이터 주체 권리: 열람, 수정, 삭제, 이동성 요청 처리 기능 구현"
      - "동의 관리: 목적별 개별 동의, 동의 철회 용이성 보장"
      - "데이터 익명화/가명화: 분석 용도 시 식별 불가 상태로 처리"
    test_criteria:
      happy: "삭제 요청 시 해당 사용자의 PII 완전 삭제/익명화"
      failure: "삭제 후 해당 사용자 PII 복구 불가"
      boundary: "가명화 데이터에서 재식별 시도 → 불가"

  # ─── V9: Communications ───

  - id: "ASVS V9.1.1 (L1)"
    title: "TLS 적용 (TLS Enforcement)"
    components: [APIServer, Infra, SDKClient]
    implementation:
      - "모든 통신 TLS 1.2 이상 필수, TLS 1.3 권장"
      - "HTTP → HTTPS 리다이렉트 + HSTS 헤더(max-age=31536000; includeSubDomains)"
      - "취약한 cipher suite 비활성화: RC4, DES, 3DES, NULL, EXPORT"
      - "Perfect Forward Secrecy(PFS) 지원 cipher suite 우선"
      - "내부 서비스 간 통신에도 TLS 또는 mTLS 적용"
    test_criteria:
      happy: "TLS 1.3 핸드셰이크 성공, A+ SSL Labs 등급"
      failure: "TLS 1.0/1.1 연결 시도 → 거부"
      boundary: "인증서 만료 7일 전 알림 → 자동 갱신 확인"

  - id: "ASVS V9.2.1 (L2)"
    title: "서버 인증서 검증 (Certificate Validation)"
    components: [SDKClient, APIServer, Infra]
    implementation:
      - "클라이언트에서 서버 인증서 체인 검증 필수"
      - "인증서 고정(certificate pinning): 모바일 앱에서 권장"
      - "인증서 투명성(CT) 로그 모니터링"
      - "자체 서명 인증서: 프로덕션 환경 사용 금지"
    test_criteria:
      happy: "유효한 CA 서명 인증서로 TLS 연결 성공"
      failure: "자체 서명 인증서 → 연결 거부"
      boundary: "인증서 폐기(revoked) → OCSP/CRL 확인 후 거부"

  # ─── V10: Malicious Code ───

  - id: "ASVS V10.3.2 (L1)"
    title: "의존성 보안 (Dependency Security)"
    components: [Infra, APIServer]
    implementation:
      - "SCA(Software Composition Analysis) 도구 CI 파이프라인 통합"
      - "알려진 취약점(CRITICAL/HIGH CVE) 포함 의존성 → 빌드 실패"
      - "lockfile(package-lock.json, yarn.lock, poetry.lock) 커밋 필수"
      - "의존성 출처 검증: 신뢰할 수 있는 레지스트리만 사용"
      - "SBOM 생성 및 유지 관리"
    test_criteria:
      happy: "CI에서 SCA 스캔 통과"
      failure: "CRITICAL CVE 의존성 포함 → 빌드/배포 차단"
      boundary: "간접 의존성(transitive)의 취약점도 탐지"

  # ─── V12: Files and Resources ───

  - id: "ASVS V12.1.1 (L1)"
    title: "파일 업로드 보안 (File Upload Security)"
    components: [APIServer, Infra]
    implementation:
      - "업로드 파일 크기 제한: 용도별 최대 크기 설정"
      - "파일 타입 검증: 확장자 + MIME type + 매직 바이트(file signature) 3중 검증"
      - "업로드 파일명: 서버에서 재생성(UUID), 원본 파일명 직접 사용 금지"
      - "저장 경로: 웹 루트 외부, 실행 권한 없는 디렉토리"
      - "안티바이러스/맬웨어 스캔: 업로드 파일 대상 자동 스캔"
    test_criteria:
      happy: "허용된 타입/크기의 파일 업로드 성공"
      failure: ".php/.jsp 등 실행 가능 파일 업로드 → 거부"
      boundary: "이중 확장자(file.jpg.php) → 거부"

  - id: "ASVS V12.3.1 (L1)"
    title: "경로 조작 방지 (Path Traversal Prevention)"
    components: [APIServer, DataLayer]
    implementation:
      - "사용자 입력에서 파일 경로 구성 금지 또는 철저한 정규화 후 검증"
      - "Path traversal 문자(../, ..\\ , %2e%2e) 필터링"
      - "chroot 또는 허용 디렉토리 화이트리스트 기반 접근 제한"
      - "심볼릭 링크 추적(symlink following) 비활성화"
    test_criteria:
      happy: "허용 경로 내 파일 접근 성공"
      failure: "../../etc/passwd 경로 접근 시도 → 차단"
      boundary: "URL 인코딩된 traversal(%2e%2e%2f) → 디코딩 후 차단"

  # ─── V13: API and Web Service ───

  - id: "ASVS V13.1.1 (L1)"
    title: "API 공통 보안 요건 (Generic API Security)"
    components: [APIServer, WebhookHandler]
    implementation:
      - "인증: 모든 API 호출에 유효한 인증 토큰 필수"
      - "인가: 엔드포인트별 접근 제어 적용"
      - "Rate limiting: 엔드포인트별/사용자별 요청 제한"
      - "입력 검증: Content-Type 헤더 검증, 요청 본문 스키마 검증"
      - "CORS: Access-Control-Allow-Origin에 와일드카드(*) 금지 (인증 API)"
    test_criteria:
      happy: "유효한 토큰 + 올바른 요청 → 200 응답"
      failure: "토큰 없이 API 호출 → 401"
      boundary: "Rate limit 도달 → 429 + Retry-After 헤더"

  - id: "ASVS V13.2.1 (L1)"
    title: "RESTful API 보안 (RESTful API Security)"
    components: [APIServer]
    implementation:
      - "HTTP 메서드 제한: 허용된 메서드만 수락, 미허용 → 405"
      - "Content-Type 검증: 예상 타입과 불일치 시 거부 (406/415)"
      - "응답에 불필요한 필드 미포함: 최소 응답 원칙"
      - "페이지네이션: 최대 페이지 크기 제한, 기본값 설정"
      - "GraphQL 사용 시: 쿼리 깊이/복잡도 제한, introspection 비활성화(프로덕션)"
    test_criteria:
      happy: "GET/POST/PUT/DELETE 정상 호출 → 적절한 상태 코드"
      failure: "Content-Type: text/html로 JSON API 호출 → 415"
      boundary: "페이지 크기 최대값 초과 요청 → 최대값으로 제한 또는 400"

  - id: "ASVS V13.3.1 (L2)"
    title: "Webhook 보안 (Webhook Security)"
    components: [WebhookHandler, APIServer]
    implementation:
      - "Webhook 수신: HMAC-SHA256 서명 검증 필수"
      - "Replay 방지: timestamp 검증 (±5분), nonce 중복 체크"
      - "Webhook 발신: TLS 전용, 수신 URL 검증(SSRF 방지)"
      - "실패 시 재시도: 지수 백오프(exponential backoff) + 최대 재시도 횟수 제한"
    test_criteria:
      happy: "유효한 HMAC 서명 + 유효 timestamp → 처리 성공"
      failure: "서명 불일치 → 401/403"
      boundary: "5분 초과 timestamp → replay 거부"

  # ─── V14: Configuration ───

  - id: "ASVS V14.2.1 (L1)"
    title: "빌드 환경 보안 (Build Environment Hardening)"
    components: [Infra]
    implementation:
      - "빌드 파이프라인: 의존성 무결성 검증, SAST/DAST 통합"
      - "디버그 기능: 프로덕션 빌드에서 비활성화 (debug=false, source map 미배포)"
      - "시크릿 관리: 환경변수 또는 시크릿 매니저 사용, 빌드 로그에 미노출"
      - "컨테이너: 최소 베이스 이미지, 불필요 패키지 미포함, non-root 실행"
    test_criteria:
      happy: "프로덕션 빌드에서 디버그 엔드포인트 미노출"
      failure: "프로덕션 환경에서 /debug, /trace 접근 → 404"
      boundary: "빌드 로그에서 시크릿 값 grep → 0건"

  - id: "ASVS V14.4.1 (L1)"
    title: "보안 HTTP 헤더 (Security HTTP Headers)"
    components: [APIServer, Infra]
    implementation:
      - "Content-Security-Policy: script-src 'self' (인라인 스크립트 최소화)"
      - "X-Content-Type-Options: nosniff"
      - "X-Frame-Options: DENY 또는 SAMEORIGIN"
      - "Strict-Transport-Security: max-age=31536000; includeSubDomains"
      - "Permissions-Policy: 불필요한 브라우저 기능(camera, microphone 등) 비활성화"
      - "Server/X-Powered-By 헤더 제거"
    test_criteria:
      happy: "응답에 CSP, HSTS, X-Content-Type-Options 헤더 포함"
      failure: "Server: Apache/2.4.51 등 버전 정보 노출 → 제거"
      boundary: "CSP 위반 시 report-uri로 위반 보고 수신"

  - id: "ASVS V14.5.1 (L1)"
    title: "HTTP 요청 헤더 검증 (HTTP Request Header Validation)"
    components: [APIServer]
    implementation:
      - "Host 헤더 검증: 허용된 호스트 목록과 대조"
      - "Content-Length / Transfer-Encoding 불일치 → 거부 (HTTP desync 방지)"
      - "요청 크기 제한: 엔드포인트별 최대 body 크기 설정"
      - "Origin/Referer 헤더 기반 CSRF 추가 방어"
    test_criteria:
      happy: "유효한 Host 헤더로 요청 → 정상 처리"
      failure: "조작된 Host 헤더 → 거부 또는 기본 응답"
      boundary: "Content-Length와 실제 본문 크기 불일치 → 400"
