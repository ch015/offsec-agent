# ─────────────────────────────────────────────────────────────
# P2-1 추가: 고위험 CWE 확장 (SSRF/XXE/Deserialization/Smuggling + Auth 계열)
# 참조: knowledge-base/tier1-dimensions/a3-dataflow.md, a4-io.md, a6-deps.md
# ─────────────────────────────────────────────────────────────
cwe_extensions_p2_1:
  - id: CWE-611
    name: "Improper Restriction of XML External Entity Reference (XXE)"
    dimensions: [A4]
    owasp: A05
    applicable_when: ["domain:backend"]
    methodology_anchor: "knowledge-base/tier1-dimensions/a4-io.md#XML_Parsing_Safety"

  - id: CWE-776
    name: "Improper Restriction of Recursive Entity References (Billion Laughs)"
    dimensions: [A4, A8]
    owasp: A05
    applicable_when: ["domain:backend"]
    methodology_anchor: "knowledge-base/tier1-dimensions/a4-io.md#XML_Parsing_Safety"

  - id: CWE-1321
    name: "Prototype Pollution"
    dimensions: [A4]
    owasp: A08
    applicable_when: ["domain:backend", "domain:frontend", "lang:javascript", "lang:typescript"]
    methodology_anchor: "knowledge-base/tier1-dimensions/a4-io.md#Deserialization_Safety"

  - id: CWE-915
    name: "Improperly Controlled Modification of Dynamically-Determined Object Attributes"
    dimensions: [A4, A2]
    owasp: A08
    applicable_when: ["domain:backend"]
    methodology_anchor: "knowledge-base/tier1-dimensions/a4-io.md#Deserialization_Safety"

  - id: CWE-444
    name: "Inconsistent Interpretation of HTTP Requests (Request Smuggling)"
    dimensions: [A3]
    owasp: A05
    applicable_when: ["domain:backend"]
    methodology_anchor: "knowledge-base/tier1-dimensions/a3-dataflow.md#HTTP_Request_Smuggling_Boundary"

  - id: CWE-524
    name: "Use of Cache Containing Sensitive Information"
    dimensions: [A3, A2]
    owasp: A01
    applicable_when: ["domain:backend", "domain:frontend"]
    methodology_anchor: "knowledge-base/tier1-dimensions/a3-dataflow.md#Cache_Poisoning_Boundary"

  - id: CWE-525
    name: "Use of Web Browser Cache Containing Sensitive Info"
    dimensions: [A3]
    owasp: A05
    applicable_when: ["domain:frontend"]
    methodology_anchor: "knowledge-base/tier1-dimensions/a3-dataflow.md#Cache_Poisoning_Boundary"

  - id: CWE-113
    name: "HTTP Response Splitting / CRLF Injection"
    dimensions: [A3, A4]
    owasp: A03
    applicable_when: ["domain:backend"]

  - id: CWE-601
    name: "URL Redirection to Untrusted Site (Open Redirect)"
    dimensions: [A3, A4]
    owasp: A01
    applicable_when: ["domain:backend", "domain:frontend"]

  - id: CWE-347
    name: "Improper Verification of Cryptographic Signature (JWT/Webhook/SAML)"
    dimensions: [A1, A6]
    owasp: A02
    applicable_when: ["all"]
    methodology_anchor: "va/checklists/api.yaml#API-AUTH-002,API-EXT-003"

  - id: CWE-384
    name: "Session Fixation"
    dimensions: [A1]
    owasp: A07
    applicable_when: ["domain:backend"]

  - id: CWE-290
    name: "Authentication Bypass by Spoofing (alg=none, kid confusion)"
    dimensions: [A1]
    owasp: A07
    applicable_when: ["all"]
    methodology_anchor: "va/checklists/api.yaml#API-AUTH-002"

# ─────────────────────────────────────────────────────────────
# P1-6 추가: Depth 모듈 5종 매핑
# 참조: va/depth/injection.md (NoSQL/GraphQL/LDAP/SSTI/Prototype Pollution 통합)
#       va/depth/access-control.md (GraphQL 중첩 쿼리 우회 등)
# 통합 이력: 초기 5개 개별 파일이었으나 va/depth/injection.md로 통합됨.
#            각 항목의 methodology_anchor가 정확한 위치를 가리킴.
# ─────────────────────────────────────────────────────────────
cwe_extensions_p1_6:
  - id: CWE-943
    name: "NoSQL Injection"
    dimensions: [A4]
    owasp: A03
    applicable_when: ["db:mongodb", "db:couchdb", "db:dynamodb", "db:firebase"]
    methodology_anchor: "va/depth/injection.md#nosql-연산자-주입"

  - id: CWE-90
    name: "LDAP Injection"
    dimensions: [A4, A1]
    owasp: A03
    applicable_when: ["auth:ldap", "auth:ad", "lang:*"]
    methodology_anchor: "va/depth/injection.md#ldap-filterdn-주입"

  - id: CWE-1336
    name: "Server-Side Template Injection (SSTI)"
    dimensions: [A4]
    owasp: A03
    applicable_when: ["framework:jinja", "framework:twig", "framework:velocity", "framework:freemarker", "framework:thymeleaf", "framework:handlebars-server"]
    methodology_anchor: "va/depth/injection.md#template-injection-ssti"

  - id: CWE-1321
    name: "Prototype Pollution"
    dimensions: [A4]
    owasp: A08
    applicable_when: ["lang:javascript", "lang:typescript"]
    methodology_anchor: "va/depth/injection.md#객체-구조-오염-prototype-pollution-등"

  - id: CWE-799
    name: "Improper Control of Interaction Frequency (GraphQL batching/aliasing)"
    dimensions: [A8, A2]
    owasp: A04
    applicable_when: ["api:graphql"]
    methodology_anchor: "va/depth/injection.md#api-쿼리-언어-남용-graphql-등"

# ─────────────────────────────────────────────────────────────
# 차원 × 도메인 그리드 (Verifier R4: 도메인별 차원 교차 누락 점검)
# CWE/OWASP 축만으로는 "A4×web3 정수 오버플로", "A1×ai-agent 프롬프트 인증"처럼
# 도메인 특화 교차를 놓친다. 활성 도메인마다 아래 우선 교차 셀이 리뷰됐는지 확인한다.
# ─────────────────────────────────────────────────────────────
dimension_domain_grid:
  web3:
    A4: "정수 오버플로/언더플로, 서명 검증(replay/malleability)"
    A2: "onlyOwner/역할 접근 제어, delegatecall 권한 경계"
    A3: "reentrancy(상태 갱신 순서), 오라클 가격 조작"
  ai-agent:
    A1: "프롬프트 기반 인증 우회, 시스템 프롬프트 유출"
    A4: "간접 프롬프트 주입(도구 출력·RAG 문서), 출력 파싱 과신뢰"
    A2: "도구/함수 호출 권한 범위, 에이전트 권한 상승"
  payment:
    A3: "금액/통화 TOCTOU, idempotency, 더블 스펜드"
    A8: "재시도·웹훅 재생 제어, rate 제한"
  commerce:
    A3: "비즈니스 로직 남용(쿠폰 스태킹·음수 수량·워크플로 스킵)"
    A2: "주문/자원 소유권 경계(BOLA)"
  infra:
    A5: "시크릿/자격증명 노출, IAM 과권한"
    A6: "SSRF→메타데이터 엔드포인트, 취약 베이스 이미지/의존성"
