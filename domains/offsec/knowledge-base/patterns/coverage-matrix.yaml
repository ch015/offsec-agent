  - id: A03
    name: "Injection"
    dimensions: [A4]
    cwe_examples: [CWE-20, CWE-74, CWE-77, CWE-78, CWE-79, CWE-89, CWE-94]

  - id: A04
    name: "Insecure Design"
    dimensions: [A2, A3, A8]
    cwe_examples: [CWE-209, CWE-256, CWE-362, CWE-434, CWE-501, CWE-522]

  - id: A05
    name: "Security Misconfiguration"
    dimensions: [A5, A7]
    cwe_examples: [CWE-16, CWE-611, CWE-1004, CWE-1032]

  - id: A06
    name: "Vulnerable and Outdated Components"
    dimensions: [A6]
    cwe_examples: [CWE-937, CWE-1035, CWE-1104]

  - id: A07
    name: "Identification and Authentication Failures"
    dimensions: [A1]
    cwe_examples: [CWE-255, CWE-287, CWE-288, CWE-306, CWE-384, CWE-798]

  - id: A08
    name: "Software and Data Integrity Failures"
    dimensions: [A6, A3]
    cwe_examples: [CWE-345, CWE-502, CWE-829]

  - id: A09
    name: "Security Logging and Monitoring Failures"
    dimensions: [A7]
    cwe_examples: [CWE-117, CWE-223, CWE-532, CWE-778]

  - id: A10
    name: "Server-Side Request Forgery (SSRF)"
