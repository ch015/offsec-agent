  - id: CWE-276
    name: "Incorrect Default Permissions"
    dimensions: [A2, A5]
    owasp: A01
    applicable_when: ["domain:infra", "domain:backend"]

owasp_top10_2021:
  - id: A01
    name: "Broken Access Control"
    dimensions: [A1, A2]
