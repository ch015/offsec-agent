# CWE/OWASP ↔ 8차원 Coverage Matrix
# 목적: Verifier Phase R4에서 CWE/OWASP 커버리지를 역추적 검증하는 데 사용
# 갱신 기준: CWE Top 25 (2024), OWASP Top 10 (2021), OWASP API Top 10 (2023)

cwe_top25:
