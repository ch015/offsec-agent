    name: "Out-of-bounds Write"
    dimensions: [A4]
    owasp: A03
    applicable_when: ["lang:c", "lang:cpp", "lang:rust-unsafe"]

  - id: CWE-79
    name: "Cross-site Scripting (XSS)"
    dimensions: [A4]
    owasp: A03
    applicable_when: ["domain:frontend", "domain:web-app"]

  - id: CWE-89
    name: "SQL Injection"
    dimensions: [A4]
    owasp: A03
    applicable_when: ["domain:backend", "domain:baas-db"]

  - id: CWE-416
    name: "Use After Free"
    dimensions: [A4]
    owasp: A03
    applicable_when: ["lang:c", "lang:cpp"]

  - id: CWE-78
    name: "OS Command Injection"
    dimensions: [A4]
    owasp: A03
    applicable_when: ["domain:backend"]

  - id: CWE-20
    name: "Improper Input Validation"
    dimensions: [A4]
    owasp: A03
    applicable_when: ["all"]

  - id: CWE-125
    name: "Out-of-bounds Read"
    dimensions: [A4]
    owasp: A03
    applicable_when: ["lang:c", "lang:cpp"]

  - id: CWE-22
    name: "Path Traversal"
    dimensions: [A4, A3]
    owasp: A01
    applicable_when: ["domain:backend"]

  - id: CWE-352
    name: "Cross-Site Request Forgery (CSRF)"
    dimensions: [A1, A4]
    owasp: A01
    applicable_when: ["domain:frontend", "domain:web-app"]

  - id: CWE-434
    name: "Unrestricted Upload of File with Dangerous Type"
    dimensions: [A4]
    owasp: A04
    applicable_when: ["domain:backend", "domain:web-app"]

  - id: CWE-862
    name: "Missing Authorization"
    dimensions: [A2]
    owasp: A01
    applicable_when: ["all"]

  - id: CWE-476
    name: "NULL Pointer Dereference"
    dimensions: [A7]
    owasp: N/A
    applicable_when: ["lang:c", "lang:cpp", "lang:go"]

  - id: CWE-287
    name: "Improper Authentication"
    dimensions: [A1]
    owasp: A07
    applicable_when: ["all"]

  - id: CWE-190
    name: "Integer Overflow or Wraparound"
    dimensions: [A4]
    owasp: A03
    applicable_when: ["lang:c", "lang:cpp", "domain:web3"]

  - id: CWE-502
    name: "Deserialization of Untrusted Data"
    dimensions: [A4, A6]
    owasp: A08
    applicable_when: ["domain:backend"]

  - id: CWE-77
    name: "Command Injection"
    dimensions: [A4]
    owasp: A03
    applicable_when: ["domain:backend"]

  - id: CWE-119
    name: "Improper Restriction of Operations within Memory Buffer"
    dimensions: [A4]
    owasp: A03
    applicable_when: ["lang:c", "lang:cpp"]

  - id: CWE-798
    name: "Use of Hard-coded Credentials"
    dimensions: [A5]
    owasp: A07
    applicable_when: ["all"]

  - id: CWE-918
    name: "Server-Side Request Forgery (SSRF)"
    dimensions: [A4, A6]
    owasp: A10
    applicable_when: ["domain:backend"]

  - id: CWE-306
    name: "Missing Authentication for Critical Function"
    dimensions: [A1, A2]
    owasp: A07
    applicable_when: ["all"]

  - id: CWE-362
    name: "Concurrent Execution Using Shared Resource (Race Condition)"
    dimensions: [A8, A3]
