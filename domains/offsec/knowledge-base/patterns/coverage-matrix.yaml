  - id: CWE-269
    name: "Improper Privilege Management"
    dimensions: [A2]
    owasp: A01
    applicable_when: ["all"]

  - id: CWE-94
    name: "Improper Control of Generation of Code (Code Injection)"
    dimensions: [A4]
    owasp: A03
    applicable_when: ["domain:backend", "domain:ai-ml"]

  - id: CWE-863
    name: "Incorrect Authorization"
    dimensions: [A2]
    owasp: A01
