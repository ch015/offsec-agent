<!doctype html><html lang="ko"><meta charset="utf-8"><title>Demo Cloud · 송장 조회</title><style>body{font-family:-apple-system,sans-serif;background:#edf2f8;color:#18283d;max-width:820px;margin:70px auto;padding:30px}header{display:flex;justify-content:space-between}h1{font-size:34px}main{background:white;border-radius:18px;padding:30px;box-shadow:0 10px 35px #15244412}button{background:#2158c0;border:0;border-radius:7px;color:white;padding:13px;margin:7px 6px 7px 0;font:inherit;cursor:pointer}button:last-child{background:#247d68}pre{background:#10233c;color:#d6e6ff;padding:22px;border-radius:10px;white-space:pre-wrap}small{color:#687d95}#status{font-weight:700}</style><header><b>DEMO CLOUD</b><small>로컬 합성 데이터</small></header><h1>송장 조회</h1><p>로그인 계정: <strong>Alice · 김고객</strong></p><main><p>정상 조회, 취약 경로, 소유권 검사 적용 경로를 비교합니다.</p><button data-route="/api/invoices/INV-A">내 송장 조회</button><button data-route="/api/invoices/INV-B">타인 송장 조회</button><button data-route="/fixed/invoices/INV-B">수정 후 동일 요청</button><p id="status">요청을 선택하세요.</p><pre id="result">모든 계정·송장·토큰은 시연용입니다.</pre></main><script>document.addEventListener('click',async e=>{const route=e.target.dataset.route;if(!route)return;const r=await fetch(route,{headers:{Authorization:'Bearer demo-alice'}});document.querySelector('#status').textContent=route+' → HTTP '+r.status;document.querySelector('#result').textContent=JSON.stringify(await r.json(),null,2);});</script></html>
